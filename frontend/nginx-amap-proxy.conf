# 高德安全密钥代理的公共部分（被 nginx.conf 里的 /_AMapService 各 location 引用，调用前先 set $amap_host）。
# 用变量 + resolver 做 proxy_pass：启动时不解析域名，DNS 暂时不可用也不会让 nginx 起不来。
if ($amap_jscode = "") {
    return 404;
}
resolver 127.0.0.11 valid=300s ipv6=off;
set $args "${args}&jscode=${amap_jscode}";
rewrite ^/_AMapService/(.*)$ /$1 break;
proxy_pass https://$amap_host;
proxy_ssl_server_name on;
proxy_set_header Host $amap_host;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_hide_header Set-Cookie;
proxy_read_timeout 15s;
