# 安全响应头。nginx 的 add_header 不会从 server 继承到写了自己 add_header 的 location，所以每个 location 都要 include 本文件。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
# 地图：高德 JS API（脚本、瓦片、数据接口在 *.amap.com / *.autonavi.com，矢量渲染用 blob worker），未配置 Key 时退回 OpenStreetMap 图块。
# 高德 JS API 用 eval 加载自身插件，必须放开 'unsafe-eval'；内联脚本仍然禁止。其余资源全部同源。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://*.amap.com https://*.autonavi.com; style-src 'self' 'unsafe-inline' https://*.amap.com; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com https://*.is.autonavi.com https://*.tile.openstreetmap.org https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://*.amap.com https://*.autonavi.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
