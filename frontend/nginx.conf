# Houses 站点：静态页面 + /api 反向代理 + /uploads 直接读共享卷。外层 HTTPS 由宿主机的 Caddy / nginx 终止。
upstream houses_api {
    server api:8020;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 房源图片单张 5MB，留出表单开销
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 实时通知（SSE）：关闭缓冲，长连接
    location = /api/notifications/stream {
        proxy_pass http://houses_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # 安全头统一由本层添加，去掉后端的同名头避免重复
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
    }

    location /api/ {
        proxy_pass http://houses_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 安全头统一由本层添加，去掉后端的同名头避免重复
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
    }

    # 高德地图安全密钥代理（官方推荐的 serviceHost 方式）。普通前缀 location，下面两个正则 location 优先匹配。
    location /_AMapService/ {
        set $amap_host restapi.amap.com;
        include /etc/nginx/snippets/amap-proxy.conf;
    }

    location ~ ^/_AMapService/v4/map/styles$ {
        set $amap_host webapi.amap.com;
        include /etc/nginx/snippets/amap-proxy.conf;
    }

    location ~ ^/_AMapService/v3/vectormap$ {
        set $amap_host fmap01.amap.com;
        include /etc/nginx/snippets/amap-proxy.conf;
    }

    location = /robots.txt {
        proxy_pass http://houses_api;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://houses_api;
        proxy_set_header Host $host;
    }

    # 房源图片：与 API 共享同一个卷，文件名带随机串，可长期缓存
    location /uploads/ {
        alias /data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # 构建产物带内容哈希，可永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # 单页应用：其余路径都回到 index.html，且不缓存，保证发布后立即生效
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
